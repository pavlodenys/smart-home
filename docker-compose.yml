services:
  smart-home-ui:
    image: smarthomefrontend
    build:
      context: smart-home-ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - smart-home-api

  smart-home-connector:
    image: smarthomeconnector
    build:
      context: smart-home-api
      dockerfile: ./SmartHome.Connector/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=SmartHouse;Username=smarthome;Password=SmartHome_local_2026!
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: rmuser
      RabbitMQ__Password: rmpassword
      RabbitMQ__ExchangeName: amq.topic
      RabbitMQ__QueueName: sensors_data
      SignalR__HubUrl: http://smart-home-api/hub
    depends_on:
      smart-home-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  smart-home-api:
    image: smarthomebackend
    build:
      context: smart-home-api
      dockerfile: ./SmartHome.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=SmartHouse;Username=smarthome;Password=SmartHome_local_2026!
      Notifications__Ntfy__Enabled: ${NTFY_ENABLED:-false}
      Notifications__Ntfy__BaseUrl: https://ntfy.sh
      Notifications__Ntfy__Topic: ${NTFY_TOPIC:-}
    ports:
      - "5200:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/80'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: SmartHouse
      POSTGRES_USER: smarthome
      POSTGRES_PASSWORD: SmartHome_local_2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthome -d SmartHouse"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.11.9-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rmuser
      RABBITMQ_DEFAULT_PASS: rmpassword
    command: /bin/sh -c "rabbitmq-plugins enable --offline rabbitmq_mqtt && rabbitmq-server"
    ports:
      - "5672:5672"
      - "15672:15672"
      - "1883:1883"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  rabbitmq-data:
